name: Apply Animal Dash race fix

on:
  push:
    branches:
      - agent/fix-race-alignment-balance

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-race-alignment-balance
          fetch-depth: 0

      - name: Patch the race logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("game.js")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """                // Stagger their starting positions slightly.\n                d: -8 - index * 7,\n\n                // Give each opponent a slightly different random speed.\n                speed: 32.4 + Math.random() * 3.2,""",
                  """                // Begin almost level with the player, with only enough\n                // separation to keep the starting animals readable.\n                d: -2 - index * 2,\n\n                // One opponent is usually beatable at normal speed, one is\n                // close, and one is quicker. Fruit and clean driving now\n                // decide the race instead of the player winning by default.\n                speed: 33.7 + index * 0.65 + Math.random() * 1.15,"""
              ),
              (
                  """        // The update loop will now move the racers.\n        game.phase = \"racing\";\n        game.start = performance.now();\n\n        await wait(450);\n\n        countdown.classList.add(\"hidden\");\n\n        // Remember when the previous frame was drawn.\n        let last = performance.now();""",
                  """        // Start movement on the same frame as GO. The countdown can\n        // remain visible briefly without holding the racers in place.\n        game.phase = \"racing\";\n        game.start = performance.now();\n\n        clearTimeout(startRace.countdownTimer);\n        startRace.countdownTimer = setTimeout(() => countdown.classList.add(\"hidden\"), 450);\n\n        // Begin timing from GO rather than 450 milliseconds later.\n        let last = game.start;"""
              ),
              (
                  """        // Keep the player towards the bottom of the visible course\n        // by moving the virtual camera behind them.\n        game.camera = Math.max(0, player.d - 90);""",
                  """        // Keep the player's course position at y = 420. Fruit, mud,\n        // opponents and the finish line now use the same position system\n        // as the player instead of appearing about 288 pixels too early.\n        game.camera = player.d;"""
              ),
              (
                  """            if (item.used || item.lane !== player.target || Math.abs(item.d - player.d) > 10) return;""",
                  """            // Use the player's visible x position, not merely the lane\n            // they have requested. This prevents collecting an item while\n            // the animal is still sliding across from another lane.\n            const horizontalDistance = Math.abs(lanes[item.lane] - player.x);\n\n            if (item.used || horizontalDistance > 44 || Math.abs(item.d - player.d) > 11) return;"""
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected source block not found:\n{old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: node --check game.js

      - name: Commit the repaired game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "Fix race alignment, start timing and balance"
          git push origin HEAD:agent/fix-race-alignment-balance
